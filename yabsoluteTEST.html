<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HA // ARCHIVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0d12;
            --off-white: #e0e0e0;
            --eva-red: #ff003c;
            --border-muted: #1e2630;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--off-white);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0.2) 50%, rgba(0, 0, 0, 0.1) 50%), 
                linear-gradient(#0a0d12, #05070a);
            background-size: 100% 4px, 100% 100%;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            border-bottom: 2px solid var(--eva-red);
            margin-bottom: 40px;
            padding-bottom: 10px;
        }

        .title {
            font-family: 'Crimson Text', serif;
            font-size: 6rem;
            line-height: 0.8;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: -2px;
            color: var(--eva-red);
            font-weight: 400;
            text-shadow: 1px 0px 0px var(--eva-red), -1px 0px 0px var(--eva-red), 0px 0.5px 0px var(--eva-red);
            display: block;
            transform: scaleX(0.95);
            transform-origin: left;
            width: 110%;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .gallery-container {
            display: flex;
            flex-direction: column;
        }

        .gallery-item {
            border: 1px solid var(--border-muted);
            aspect-ratio: 1/1;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            position: relative;
        }

        .gallery-caption {
            margin-top: 10px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--off-white);
            opacity: 0.8;
            border-left: 1px solid var(--eva-red);
            padding-left: 8px;
            font-weight: 700;
        }

        .gallery-item::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) brightness(0.9);
            transition: 0.4s ease;
            z-index: 1;
            display: block;
        }

        .gallery-item:hover img {
            filter: contrast(1.2) brightness(1.1);
            transform: scale(1.05);
        }

        .upload-terminal {
            border: 1px solid var(--eva-red);
            background: #ffffff;
            position: relative;
            padding: 0;
            height: 650px;
            overflow: hidden;
            border-radius: 2px;
        }

        .upload-terminal::before {
            content: "SECURE UPLOAD PORTAL // DIRECT FEED";
            position: absolute;
            top: -12px; left: 15px;
            background: var(--bg-deep);
            padding: 0 10px;
            font-size: 0.6rem;
            color: var(--eva-red);
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #555;
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            cursor: pointer;
        }

        .back-link:hover { color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="title">THE ARCHIVE</h1>
    </div>

    <p style="font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 30px; opacity: 0.6; text-transform: uppercase;">
        // MODERATED USER UPLOADS
    </p>

    <div class="gallery-grid" id="dynamic-gallery">

    </div>

    <script>
        function renderGallery(items) {
            const grid = document.getElementById('dynamic-gallery');
            grid.innerHTML = ''; 
            
            items.forEach(item => {
                const container = document.createElement('div');
                container.className = 'gallery-container';
                
                container.innerHTML = `
                    <div class="gallery-item">
                        <img src="${item.url}" alt="${item.name}">
                    </div>
                    <div class="gallery-caption">${item.name}</div>
                `;
                grid.appendChild(container);
            });
        }


        fetch('gallery.json')
            .then(response => response.json())
            .then(data => renderGallery(data))
            .catch(error => {
                console.warn('Fetch failed (likely due to local file:// CORS security). Using fallback data for testing.');
                

                const fallbackData = [
                    {
                        "url": "https://www.dropbox.com/scl/fi/r80o0urmrhee09fd45y67/princesskilljoy.jpg?raw=1",
                        "name": "Transmission 01 // Princesskilljoy"
                    },
                    {
                        "url": "https://www.dropbox.com/scl/fi/5l24pm8bgf4h54xi0ruta/evsuliini.jpg?raw=1",
                        "name": "Transmission 02 // evsuliini"
                    }
                ];
                renderGallery(fallbackData);
            });
    </script>

    <div class="upload-terminal">
        <iframe src="https://tally.so/r/VLMYxN" title="Archive Upload"></iframe>
    </div>

    <div id="back-to-main" class="back-link">← RETURN TO MAIN TERMINAL</div>
</div>

<script>
    document.getElementById('back-to-main').addEventListener('click', function() {
        window.location.href = 'index.html';
    });
</script>

</body>
</html>
